name: Bug Report
description: Something is not working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable the Web Dashboard setting
        2. Open the dashboard on your phone
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: "please don't say latest"
    validations:
      required: true

  - type: input
    id: dispatcharr_version
    attributes:
      label: Dispatcharr version
      placeholder: "please don't say latest"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any Dispatcharr server logs (grep for "Source Switch") here.
      render: shell
    validations:
      required: false

  - type: markdown
    attributes:
      value: "**Screenshots are helpful for visual issues** (layout problems on mobile, stats not updating, etc.). Attach them to this issue after submission."
